<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SalesOrder</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top app bar -->
  <header class="appbar">
    <button class="appbar__back" id="btnBack" aria-label="Back" hidden>&#8592;</button>
    <h1 class="appbar__title" id="appTitle">Sales Orders</h1>
    <button class="appbar__action" id="btnHeaderAction" hidden></button>
  </header>

  <!-- Screens get injected here -->
  <main id="view" class="view"></main>

  <!-- Bottom navigation -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar__btn is-active" data-nav="orders">
      <span class="tabbar__icon">&#128220;</span><span>Orders</span>
    </button>
    <button class="tabbar__btn tabbar__btn--fab" data-nav="new">
      <span class="tabbar__icon">&#43;</span><span>New</span>
    </button>
    <button class="tabbar__btn" data-nav="items">
      <span class="tabbar__icon">&#128230;</span><span>Items</span>
    </button>
    <button class="tabbar__btn" data-nav="customers">
      <span class="tabbar__icon">&#128100;</span><span>Parties</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
